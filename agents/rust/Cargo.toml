[package]
name = "tss-agent"
version = "1.0.0"
edition = "2021"
build = "build.rs"

[[bin]]
name = "tss-agent"
path = "src/main.rs"

[dependencies]
# native-tls => schannel on Windows, Security.framework on macOS. The agent then uses
# the machine's own certificate store and proxy settings, which is what keeps it working
# on corporate networks that do TLS inspection.
ureq = { version = "2.10", default-features = false, features = ["json", "gzip", "native-tls"] }
native-tls = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.31"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
