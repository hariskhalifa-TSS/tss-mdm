[package]
name = "tss-agent"
version = "0.5.0"
edition = "2021"

[[bin]]
name = "tss-agent"
path = "src/main.rs"

[dependencies]
ureq = { version = "2.10", features = ["json", "tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.31"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
